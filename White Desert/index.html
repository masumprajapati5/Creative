<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap-animation-project-01</title>
  </head>
  <body>
    <main>
      <div class="landing-page">
        <h2>Landing Page</h2>
      </div>
      <section class="animation-section">
        <div class="initial-image">
          <div class="initial-image-content">
            <h1>White Desert</h1>
          </div>
          <img
            src="https://images.unsplash.com/photo-1786604455363-5001cd5575b6?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
        </div>
        <div class="strip-reveal">
          <div class="strips">
            <div class="strip strip-1"></div>
            <div class="strip strip-2"></div>
            <div class="strip strip-3"></div>
          </div>
        </div>
        <div class="image-cards-section">
          <div class="card card1">
            <img
              src="https://images.unsplash.com/photo-1786604455362-321b116175a4?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
          </div>
          <div class="card">
            <img
              src="https://images.unsplash.com/photo-1726519161022-61bbcce396ca?q=80&w=1123&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
          </div>
          <div class="card">
            <img
              src="https://images.unsplash.com/photo-1755644530833-cb40e18d5a31?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
          </div>
        </div>
        <div class="final-text-reveal">
          <div class="imagereveal">
            <img
              src="https://images.unsplash.com/photo-1761959165302-f75021053512?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
          </div>
          <div class="final-text-reveal-content">
            <h2>Stanley Stewart</h2>
          </div>
        </div>
      </section>
      <div class="footer-page">
        <h2>Footer</h2>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
